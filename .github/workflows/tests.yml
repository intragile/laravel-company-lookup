name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: none, ctype, curl, dom, fileinfo, filter, iconv, json, libxml, mbstring, openssl, pdo, pdo_sqlite, sqlite3, phar, simplexml, tokenizer, xml, xmlwriter, zip
          coverage: none
      - run: composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: ext-soap must not be needed
        run: |
          php -r 'exit(extension_loaded("soap") ? 1 : 0);'
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pint --test
